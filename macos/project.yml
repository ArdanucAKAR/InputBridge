name: InputBridgeMac
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Release builds override these from the git tag; 0.0.0 marks a local development build.
    MARKETING_VERSION: "0.0.0"
    # Full version including any -beta suffix; read by the updater.
    INPUTBRIDGE_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Developer ID provisioning profiles, passed in by scripts/package-macos.sh for signed builds.
    INPUTBRIDGE_APP_PROFILE: ""
    INPUTBRIDGE_CAMERA_PROFILE: ""
targets:
  InputBridgeMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/InputBridgeMac
      - path: Sources/Shared
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: InputBridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.inputbridge.mac
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/InputBridge.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(INPUTBRIDGE_APP_PROFILE)
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: AppKit.framework
      - sdk: CoreBluetooth.framework
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
      - sdk: IOBluetooth.framework
      - sdk: SystemExtensions.framework
      - sdk: CryptoKit.framework
      - sdk: CoreMediaIO.framework
      - target: InputBridgeCamera
        embed: true
        codeSign: true
    scheme:
      testTargets: []
      gatherCoverageData: false
  InputBridgeCamera:
    type: system-extension
    platform: macOS
    sources:
      - path: Sources/InputBridgeCamera
      - path: Sources/Shared
    settings:
      base:
        # sysextd looks the extension up as Contents/Library/SystemExtensions/<bundle ID>.systemextension,
        # so the product must be named after the bundle identifier.
        PRODUCT_NAME: com.inputbridge.mac.camera
        PRODUCT_BUNDLE_IDENTIFIER: com.inputbridge.mac.camera
        INFOPLIST_FILE: Resources/CameraExtension-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/CameraExtension.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(INPUTBRIDGE_CAMERA_PROFILE)
        SKIP_INSTALL: YES
    dependencies:
      - sdk: CoreMediaIO.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
