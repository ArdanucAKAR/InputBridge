name: Build and release installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (example: 0.2.0)"
        required: true
        default: "0.2.0"
      create_release:
        description: "Create a draft GitHub release"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: inputbridge-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 8.0.x

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      should_release: ${{ steps.release.outputs.value }}
    steps:
      - id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.create_release }}" == "true" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore and build Windows controller
        shell: pwsh
        run: |
          dotnet restore ./windows/src/InputBridge.Windows/InputBridge.Windows.csproj
          dotnet build ./windows/src/InputBridge.Windows/InputBridge.Windows.csproj -c Release --no-restore
      - name: Publish Windows controller
        shell: pwsh
        run: ./windows/scripts/publish-windows.ps1 -Version "${{ needs.metadata.outputs.version }}"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Create installer
        shell: pwsh
        run: iscc "/DMyAppVersion=${{ needs.metadata.outputs.version }}" ./windows/installer/InputBridge.iss
      - uses: actions/upload-artifact@v4
        with:
          name: InputBridge-Windows
          if-no-files-found: error
          path: windows/dist/installer/InputBridge-Windows-Setup.exe

  macos:
    needs: metadata
    runs-on: macos-15
    env:
      # Signing and notarization run only when these secrets exist (they are not passed to forks),
      # otherwise the job falls back to an ad-hoc signed build. See docs/RELEASING_TR.md.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && vars.MACOS_TEAM_ID != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Import Developer ID certificate and provisioning profiles
        if: env.HAS_SIGNING == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_PROFILE_B64: ${{ secrets.MACOS_APP_PROFILE }}
          CAMERA_PROFILE_B64: ${{ secrets.MACOS_CAMERA_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Without Apple's Developer ID G2 intermediate the identity is "not trusted" and codesign refuses it.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

          install_profile() {
            local file="$RUNNER_TEMP/$1.provisionprofile"
            echo "$2" | base64 --decode > "$file"
            local uuid
            uuid=$(security cms -D -i "$file" | plutil -extract UUID raw -)
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                       "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$dir"
              cp "$file" "$dir/$uuid.provisionprofile"
            done
            echo "$uuid"
          }
          echo "MACOS_APP_PROFILE=$(install_profile app "$APP_PROFILE_B64")" >> "$GITHUB_ENV"
          echo "MACOS_CAMERA_PROFILE=$(install_profile camera "$CAMERA_PROFILE_B64")" >> "$GITHUB_ENV"
          echo "MACOS_TEAM_ID=${{ vars.MACOS_TEAM_ID }}" >> "$GITHUB_ENV"
      - name: Prepare notarization key
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/notary-key.p8"
          echo "$NOTARY_KEY_P8" > "$KEY"
          echo "NOTARY_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Build macOS application and DMG
        env:
          INPUTBRIDGE_VERSION: ${{ needs.metadata.outputs.version }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          chmod +x macos/scripts/package-macos.sh
          macos/scripts/package-macos.sh
      - name: Remove signing material
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP"/*.provisionprofile "$RUNNER_TEMP/notary-key.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: InputBridge-macOS
          if-no-files-found: error
          path: |
            macos/dist/InputBridge-macOS.pkg
            macos/dist/InputBridge-macOS.dmg

  release:
    if: needs.metadata.outputs.should_release == 'true'
    needs: [metadata, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          # Versions with a suffix (0.3.0-beta.1) are published as pre-releases:
          # downloadable from the Releases page, but ignored by the in-app updater.
          EXTRA_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              artifacts/InputBridge-Windows/InputBridge-Windows-Setup.exe \
              artifacts/InputBridge-macOS/InputBridge-macOS.pkg \
              artifacts/InputBridge-macOS/InputBridge-macOS.dmg \
              --clobber
          else
            gh release create "$TAG" \
              artifacts/InputBridge-Windows/InputBridge-Windows-Setup.exe \
              artifacts/InputBridge-macOS/InputBridge-macOS.pkg \
              artifacts/InputBridge-macOS/InputBridge-macOS.dmg \
              --title "InputBridge ${TAG}" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              "${EXTRA_FLAGS[@]}"
          fi
